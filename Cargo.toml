[package]
name = "ruckus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Start ROS 2 sessions in tmux with one command, and (soon) install and manage ROS 2 itself"
repository = "https://github.com/SeamusMullan/ruckus"
keywords = ["ros2", "ros", "tmux", "robotics", "cli"]
categories = ["command-line-utilities", "science::robotics"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
