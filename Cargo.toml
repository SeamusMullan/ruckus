[package]
name = "ruckus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Start ROS 2 sessions in tmux with one command, and (soon) install and manage ROS 2 itself"
repository = "https://github.com/SeamusMullan/ruckus"
keywords = ["ros2", "ros", "tmux", "robotics", "cli"]
categories = ["command-line-utilities", "science::robotics"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"
rattler = { version = "0.54.0", features = ["indicatif"] }
rattler_cache = "0.10.18"
rattler_conda_types = "0.56.2"
rattler_lock = "0.34.6"
rattler_repodata_gateway = { version = "0.36.3", features = ["gateway"] }
rattler_shell = "0.29.3"
rattler_solve = "11.2.1"
rattler_virtual_packages = "8.1.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
