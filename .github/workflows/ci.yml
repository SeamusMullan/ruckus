name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to notice when RoboStack or conda-forge changes break installs.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm-256color
      RUCKUS_NETWORK_TESTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux zsh; fi
          tmux -V
          zsh --version
      - run: cargo test --locked

  smoke:
    name: Smoke test release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm-256color
      RUCKUS_TMUX_SOCKET: ruckus-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - run: cargo build --locked --release
      - name: Run the binary like a user would
        run: |
          set -eux
          bin=target/release/ruckus
          $bin --version
          $bin --help
          $bin ls
          $bin show turtle
          $bin up turtle --dry-run
          $bin completions zsh | grep -q '#compdef ruckus'
          # A missing package must fail, not start a broken session.
          if $bin up robot --dry-run --workspace "$RUNNER_TEMP"; then exit 1; fi
          # Start and stop a real session from a user config.
          mkdir -p "$RUNNER_TEMP/cfg/ruckus"
          printf '[layouts.smoke]\npanes = [{ run = "echo a" }, { run = "echo b" }]\n' > "$RUNNER_TEMP/cfg/ruckus/config.toml"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg"
          $bin up smoke --detach
          test "$(tmux -L ruckus-smoke list-panes -t =ruckus-smoke | wc -l)" -eq 2
          $bin down smoke
          # An environment over a fake ROS install, used by run.
          mkdir -p "$RUNNER_TEMP/ros"
          echo 'export ROS_DISTRO=smoke' > "$RUNNER_TEMP/ros/setup.bash"
          SHELL=/bin/bash $bin env create smoke --ros "$RUNNER_TEMP/ros" --var ROS_DOMAIN_ID=9
          $bin env ls
          $bin env show smoke
          test "$(SHELL=/bin/bash $bin run -e smoke -- printenv ROS_DISTRO)" = smoke
          $bin env rm smoke
      - uses: actions/upload-artifact@v7
        with:
          name: ruckus-${{ matrix.os }}
          path: target/release/ruckus

  install:
    name: Install ROS 2 ${{ matrix.distro }} end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        distro: [jazzy, lyrical]
    runs-on: ${{ matrix.os }}
    env:
      ROS_DOMAIN_ID: 42
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Install ${{ matrix.distro }} (ros-base and build tools)
        run: target/release/ruckus install ${{ matrix.distro }} --variant base
      - name: Use it
        run: |
          set -eux
          bin=target/release/ruckus
          $bin distros
          $bin env show "$DISTRO"
          test "$(SHELL=/bin/bash $bin run -e "$DISTRO" -- printenv ROS_DISTRO)" = "$DISTRO"
          # A message makes the round trip between two processes.
          cat > "$RUNNER_TEMP/roundtrip.sh" <<'SH'
          ros2 topic pub -r 5 /ci std_msgs/msg/String "{data: ruckus}" >/dev/null 2>&1 &
          pid=$!
          out=$(ros2 topic echo /ci std_msgs/msg/String --once --timeout 60)
          kill $pid
          echo "$out"
          echo "$out" | grep -q "data: ruckus"
          SH
          SHELL=/bin/bash $bin run -e "$DISTRO" -- bash "$RUNNER_TEMP/roundtrip.sh"
          # A Python package builds with colcon and runs.
          mkdir -p "$RUNNER_TEMP/ws/src"
          cat > "$RUNNER_TEMP/build.sh" <<'SH'
          set -e
          cd "$1/src"
          ros2 pkg create --build-type ament_python --node-name hi py_hi
          cd "$1"
          colcon build
          . install/setup.bash
          ros2 run py_hi hi
          SH
          SHELL=/bin/bash $bin run -e "$DISTRO" -- bash "$RUNNER_TEMP/build.sh" "$RUNNER_TEMP/ws" | tee "$RUNNER_TEMP/build.out"
          grep -q "Hi from py_hi" "$RUNNER_TEMP/build.out"
          $bin uninstall "$DISTRO"
